<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Loading…</title>
<script>
// Clean per-client links: joxelds.github.io/Claude/<venue-or-client-id>
// GitHub Pages serves this 404 for unknown paths — turn the path into ?v=
(function () {
  var m = location.pathname.match(/^\/Claude\/([a-z0-9_-]+)\/?$/i);
  if (m && !["owner", "review", "marketing", "icons", "assets"].includes(m[1].toLowerCase())) {
    location.replace("/Claude/?v=" + encodeURIComponent(m[1].toLowerCase()) + location.hash);
  } else {
    location.replace("/Claude/");
  }
})();
</script>
</head>
<body style="background:#16152e"></body>
</html>
