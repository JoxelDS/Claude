<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Loading…</title>
<script>
  var BASE = "/" + (location.pathname.split("/")[1] || "") + "/"; // project pages: first segment is the repository name
// Clean per-client links: <site>/<venue-or-client-id>  (BASE below must match vite base)
// GitHub Pages serves this 404 for unknown paths — turn the path into ?v=
(function () {
  // a mistyped Learn / marketing link goes back to Learn (or the product page), not to the app's sign-in
  var p = location.pathname;
  if (/^\/Claude\/(marketing\/)?learn(\/|$)/i.test(p)) { location.replace(BASE + "marketing/learn/" + (/\/learn\/es(\/|$)/i.test(p) ? "es/" : "")); return; }
  if (/^\/Claude\/marketing\//i.test(p)) { location.replace(BASE + "marketing/"); return; }
  var m = p.match(/^\/Claude\/([a-z0-9_-]+)\/?$/i);
  if (m && !["owner", "review", "marketing", "icons", "assets", "learn"].includes(m[1].toLowerCase())) {
    location.replace(BASE + "?v=" + encodeURIComponent(m[1].toLowerCase()) + location.hash);
  } else {
    location.replace(BASE);
  }
})();
</script>
</head>
<body style="background:#16152e"></body>
</html>
