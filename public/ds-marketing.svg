<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <!-- DS Marketing — white mark for dark backgrounds -->
  <defs>
    <mask id="dsCut">
      <rect x="0" y="0" width="480" height="300" fill="white"/>
      <!-- band cut through the DS where MARKETING sits -->
      <rect x="40" y="126" width="400" height="50" fill="black"/>
    </mask>
    <filter id="dsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Big high-contrast serif DS, cut by the band -->
  <g filter="url(#dsShadow)">
    <text x="240" y="242" text-anchor="middle"
      font-family="Didot, 'Bodoni MT', 'Playfair Display', Georgia, serif"
      font-size="255" font-weight="700" letter-spacing="2"
      fill="#FFFFFF" mask="url(#dsCut)">DS</text>
  </g>

  <!-- MARKETING across the band -->
  <text x="240" y="163" text-anchor="middle"
    font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="30" font-weight="500" letter-spacing="20"
    fill="#FFFFFF">MARKETING</text>
</svg>
