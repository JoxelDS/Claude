<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2A295C" />
    <!-- Cache busting: force browsers to always revalidate index.html -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png" />
    <!-- iOS / iPadOS install support -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="SDX Inspect" />
    <!-- iOS splash screens (portrait) -->
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/icons/icon-512.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="/icons/icon-512.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="/icons/icon-512.png" />
    <!-- MS Tiles -->
    <meta name="msapplication-TileColor" content="#2A295C" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    <!-- DNS prefetch + preconnect for Google Fonts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Firebase preconnect (auth + Firestore + Storage) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://securetoken.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <!-- Google Translate CDN — dns-prefetch only since it loads async -->
    <link rel="dns-prefetch" href="//translate.google.com" />
    <link rel="dns-prefetch" href="//translate.googleapis.com" />
    <!-- Preload font CSS so it starts downloading immediately -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <title>Sodexo Live! Kitchen Inspection</title>
    <!-- Inline critical CSS for instant first paint -->
    <style>
      body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f7}
      #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:linear-gradient(135deg,#2A295C 0%,#1e1d4a 50%,#283897 100%);z-index:9999;transition:opacity .3s}
      #splash.hide{opacity:0;pointer-events:none}
      .sp-logo{font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:-.3px}
      .sp-bar{width:120px;height:3px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
      .sp-fill{width:40%;height:100%;background:#EE0000;border-radius:3px;animation:sp .8s ease infinite alternate}
      @keyframes sp{from{transform:translateX(0)}to{transform:translateX(200%)}}
    </style>
  <!-- Google Translate — loaded async so it never blocks first paint -->
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        { pageLanguage: 'en', autoDisplay: false },
        'google_translate_element'
      );
    }
    // Defer until after page is interactive
    window.addEventListener('load', function() {
      var s = document.createElement('script');
      s.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
      s.async = true;
      document.head.appendChild(s);
    });
  </script>
  <style>
    /* Hide ALL Google Translate chrome — banner, tooltip, top bar, logo */
    .goog-te-banner-frame,
    .goog-te-balloon-frame,
    .goog-te-menu-frame,
    #goog-gt-tt,
    .goog-tooltip,
    .goog-tooltip-content,
    .goog-te-spinner,
    .VIpgJd-ZVi9od-aZ2wEe,
    .VIpgJd-ZVi9od-aZ2wEe-OiiCO,
    iframe.skiptranslate,
    .skiptranslate { display: none !important; visibility: hidden !important; }
    /* Prevent Google from pushing body down or repositioning it */
    body,
    body.translated-ltr,
    body.translated-rtl { top: 0 !important; margin-top: 0 !important; position: static !important; }
    /* Kill the top bar that flashes when translation is applied */
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    font[style*="vertical-align"] { vertical-align: inherit !important; }
  </style>
  </head>
  <body>
    <!-- Google Translate widget — mounted here permanently, teleported into popover via JS -->
    <div id="google_translate_element" style="position:fixed;top:-9999px;left:-9999px;"></div>
    <!-- Instant splash screen while JS loads -->
    <div id="splash">
      <div class="sp-logo">Sodexo Live!</div>
      <div class="sp-bar"><div class="sp-fill"></div></div>
    </div>
    <div id="root"></div>
    <!-- Capture early JS errors so the splash can display them instead of looping -->
    <script>
      window.__earlyErrors = [];
      window.addEventListener("error", function (e) {
        window.__earlyErrors.push((e.message || "Unknown error") + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__earlyErrors.push("Promise: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Splash watchdog: if React hasn't dismissed the splash in 6s, the JS
         bundle likely failed to load (stale SW cache). Clear all caches and reload. -->
    <script>
      (function () {
        var TIMEOUT = 6000;
        var t = setTimeout(function () {
          var splash = document.getElementById("splash");
          if (!splash || splash.classList.contains("hide")) return; // React mounted fine
          // Count attempts — reload once, then STOP and show the real error
          var attempts = 0;
          try { attempts = parseInt(sessionStorage.getItem("sdx_boot_attempts") || "0", 10); } catch (e) {}
          if (attempts >= 1) {
            try { sessionStorage.removeItem("sdx_boot_attempts"); } catch (e) {}
            var errs = (window.__earlyErrors || []).slice(0, 4).join("\n");
            splash.innerHTML =
              '<div style="max-width:340px;text-align:center;font-family:sans-serif;color:#fff;padding:20px">' +
              '<div style="font-size:2rem;margin-bottom:10px">⚠️</div>' +
              '<div style="font-weight:700;margin-bottom:8px">The app could not start</div>' +
              '<div style="font-size:0.72rem;color:rgba(255,255,255,.7);white-space:pre-wrap;word-break:break-word;text-align:left;background:rgba(0,0,0,.35);border-radius:8px;padding:10px;margin-bottom:12px">' +
              (errs ? errs.replace(/</g, "&lt;") : "No error captured — likely a network problem reaching the server.") +
              '</div>' +
              '<button onclick="sessionStorage.clear();location.reload()" style="background:#EE0000;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-weight:700">Try Again</button>' +
              '</div>';
            splash.style.display = "flex";
            splash.style.alignItems = "center";
            splash.style.justifyContent = "center";
            return;
          }
          try { sessionStorage.setItem("sdx_boot_attempts", String(attempts + 1)); } catch (e) {}
          // React never mounted — nuke SW caches and reload fresh (one time only)
          if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage("CLEAN_CACHE");
          }
          if ("caches" in window) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).then(function () { window.location.reload(true); });
          } else {
            window.location.reload(true);
          }
        }, TIMEOUT);
        // React dismissed splash — cancel watchdog
        var observer = new MutationObserver(function () {
          var splash = document.getElementById("splash");
          if (!splash || splash.classList.contains("hide")) {
            clearTimeout(t);
            observer.disconnect();
            try { sessionStorage.removeItem("sdx_boot_attempts"); } catch (e) {}
          }
        });
        observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });
      })();
    </script>
  </body>
</html>
