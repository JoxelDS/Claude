  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // v552 (owner: "when you touch the screen it zooms out"): iPhone / iPad — Safari, Home Screen
      // and the app — zoom the page by themselves when a box gets the tap. Locking the scale at 1
      // stops that automatic zoom in and out. Android and computers keep the plain tag (they do not
      // auto-zoom, and people can still pinch there).
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
          if (!ios) return;
          var m = document.querySelector('meta[name="viewport"]');
          if (m && !/maximum-scale/.test(m.content)) m.setAttribute("content", m.content + ", minimum-scale=1, maximum-scale=1");
        } catch (e) {}
      })();
    </script>

    <!-- PWA Manifest -->

    <script>
      // Customer venues (?v=slug) must never fall back to the home venue: keep the venue for this tab
      // across URL clean-ups and the automatic update reload, brand the splash, and give installs a
      // start URL that carries the venue. ?v=default clears it.
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var clean = function (x) { return (x || "").trim().toLowerCase().replace(/[^a-z0-9_-]/g, ""); };
          var v = clean(q.get("v"));
          if (v === "default") { sessionStorage.removeItem("sdx_venue_tab"); sessionStorage.removeItem("sdx_vname_tab"); v = ""; }
          else if (v) { sessionStorage.setItem("sdx_venue_tab", v); if (q.get("vname")) sessionStorage.setItem("sdx_vname_tab", q.get("vname")); }
          else {
            v = clean(sessionStorage.getItem("sdx_venue_tab"));
            if (v) {
              q.set("v", v); var vn = sessionStorage.getItem("sdx_vname_tab"); if (vn && !q.has("vname")) q.set("vname", vn);
              history.replaceState(history.state, "", location.pathname + "?" + q.toString() + location.hash);
            }
          }
          window.__sdxTabVenue = v;
          if (!v) return;
          document.title = "SDX Inspect";
          var base = location.origin + location.pathname.replace(/[^/]*$/, "");
          var m = { name: "SDX Inspect", short_name: "SDX Inspect", start_url: base + "?v=" + encodeURIComponent(v), scope: base, display: "standalone",
            orientation: "portrait-primary", background_color: "#2A295C", theme_color: "#2A295C",
            icons: [192, 512].map(function (n) { return { src: base + "icons/icon-" + n + ".png", sizes: n + "x" + n, type: "image/png" }; }) };
          var link = document.querySelector('link[rel="manifest"]');
          if (link) link.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" }));
        } catch (e) {}
      })();
    </script>

  <!-- SDX login motion (2026-10-10) — boot choreography + sign-in entrance.
       Layered ON TOP of the sign-in hotfix above: the canvas color, the
       .pinOverlay height/scroll rules and the .pinBtn colors are untouched;
       where anything overlapped, the hotfix behavior wins.
       Boot overlay (#sdx-boot): first frame matches the native splash
       artwork exactly (flat #16152E, white SDX mark at 34% width with its
       center at 40% height, wordmark + #B9BBD9 tagline beneath — measured
       from splash-iphone-1290x2796.png). The mark paths are the shipped
       favicon geometry (viewBox 64: rounded square + check). Transform /
       opacity / stroke only — GPU-cheap, no backdrop-filter, no assets.
       Dismissal is pure CSS (sdxBootExit at 1.6s) so it can never trap
       the user if JS fails; the inline watcher in <body> dismisses it
       earlier once the app has mounted, and it is pointer-events:none
       from the first frame, so it never blocks a tap.
       RETIMED 2026-10-10 (v2, owner: "make the loading faster and also
       the effects"): every beat scaled ~0.64x in step — same shapes,
       same overlaps; watcher minimum hold 1.4s → 0.7s, CSS fallback
       exit 2.35s → 1.6s. The draw still completes before the exit. -->
  <style>
    #sdx-boot{position:fixed;inset:0;z-index:10100;background:#16152E;pointer-events:none;animation:sdxBootExit .45s ease-in-out 1.6s both;will-change:opacity,transform}
    #sdx-boot.boot-done{animation:none;opacity:0;visibility:hidden;transform:scale(1.035);transition:opacity .45s ease-in-out,transform .45s ease-in-out,visibility 0s linear .45s}
    .boot-glow{position:absolute;left:50%;top:40%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,rgba(40,56,151,.55) 0%,rgba(40,56,151,0) 62%);opacity:0;animation:sdxBootGlow .95s ease .19s both}
    .boot-stage{position:absolute;left:0;right:0;top:32.2%;display:flex;flex-direction:column;align-items:center}
    .boot-mark{width:34vw;max-width:150px;height:auto;display:block}
    .boot-sq,.boot-ck{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100}
    .boot-sq{stroke-width:5.5;animation:sdxDraw .45s cubic-bezier(.65,0,.35,1) .03s both}
    .boot-ck{stroke-width:6.5;animation:sdxDraw .27s cubic-bezier(.33,1,.68,1) .32s both}
    .boot-name{margin-top:16px;font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:#fff;opacity:0;animation:sdxBootRise .32s cubic-bezier(.22,1,.36,1) .5s both}
    .boot-tag{margin-top:10px;font-size:16px;font-weight:500;letter-spacing:.01em;line-height:1.35;color:#B9BBD9;opacity:0;animation:sdxBootRise .29s cubic-bezier(.22,1,.36,1) .61s both}
    @keyframes sdxDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    @keyframes sdxBootGlow{0%{opacity:0;transform:scale(.82)}55%{opacity:.55}100%{opacity:.3;transform:scale(1)}}
    @keyframes sdxBootRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes sdxBootExit{to{opacity:0;transform:scale(1.035);visibility:hidden}}
    /* Sign-in entrance: the card gets a slight-overshoot rise (this
       higher-specificity rule supersedes App.css's pinCardIn entrance;
       App.css itself is untouched) and the card's children stagger in. */
    .pinOverlay .pinCard{animation:sdxCardIn .45s cubic-bezier(.22,1,.36,1) both}
    .pinLogo,.pinTitle,.pinSub,.pinForm,.pinIg,.pinFooter{animation:sdxPinRise .42s cubic-bezier(.22,1,.36,1) both}
    .pinLogo{animation-delay:.04s}
    .pinTitle{animation-delay:.08s}
    .pinSub{animation-delay:.13s}
    .pinForm{animation-delay:.19s}
    .pinIg{animation-delay:.27s}
    .pinFooter{animation-delay:.33s}
    @keyframes sdxCardIn{0%{opacity:0;transform:translateY(26px) scale(.98)}62%{opacity:1;transform:translateY(-3px) scale(1.002)}100%{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes sdxPinRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    /* Reduced motion: no choreography — static, fully drawn frame and the
       overlay clears immediately; the sign-in renders in its final state. */
    @media (prefers-reduced-motion: reduce){
      #sdx-boot{animation:sdxBootExit .01s linear .05s both}
      .boot-sq,.boot-ck{animation:none;stroke-dashoffset:0}
      .boot-glow{animation:none;opacity:.3}
      .boot-name,.boot-tag{animation:none;opacity:1;transform:none}
      .pinOverlay .pinCard,.pinLogo,.pinTitle,.pinSub,.pinForm,.pinIg,.pinFooter{animation:none !important}
    }

  <!-- SDX sign-in layout (2026-10-10) — centered card, status-bar
       spacing, IG icon chip, pending polish. owner: "Put sign in the
       middle", "on the top make the time thing good — do not see the
       information merge with the time on the phone", "just the [IG]
       icon somewhere good place."
       CENTERING: App.css centers the overlay with align-items only
       inside one media query ((max-width:768px) and (min-height:501px)),
       and plain flex centering in a SCROLLABLE overlay (PR #14 made
       .pinOverlay overflow-y:auto) clips the card's top edge whenever
       the card is taller than the visible viewport — keyboard up, or
       the native shell's shrunken webview after a keyboard dismissal.
       margin:auto on the card is the safe pattern: it centers when
       there is free space and collapses to zero when there is not, so
       the card starts at the top and every pixel stays scrollable.
       It also centers at every width and height, not just inside
       that one media query.
       SAFE AREA: the viewport meta already ships viewport-fit=cover,
       so in installed / full-screen contexts the page runs UNDER the
       phone's clock and env(safe-area-inset-top) is the only thing
       keeping content clear of it. The rules below restate App.css's
       own safe-area values for the sign-in overlay and the app header
       so the guarantee holds from this file too — env() resolves to
       0 in browser tabs and in the native shell (the Capacitor

       there, and max()/calc() preserve the existing paddings

       IG CHIP + PENDING: CSS only — the PR #16 injection script, its
       href and the native .pinIg text row (App.jsx patch, still in

  <style>

    <style id="sdx-menu-scroll-hotfix">
    /* ===== SDX MENU SCROLL HOTFIX (2026-10-10) =====
       Bug: the header dropdown menu renders and caps its height, but does not
       touch-scroll in the app (WKWebView), and its last rows sit off-screen.
       Root causes, both in src/App.css:
       1) .topBar is position:fixed AND permanently transformed
          (.topBar{transform:translateZ(0);will-change:transform}). A transformed
          fixed ancestor breaks touch scrolling of an overflow descendant in
          WebKit (Blink is unaffected, which is why it "works on desktop").
       2) .dropdownMenu{max-height:calc(100vh - 90px)} ignores the panel's top
          offset (fixed header height + safe-area-inset-top + 8px gap), so the
          panel box extends below the visible screen and its last rows
          (IG row, version footer) can never be scrolled into view.
       Fix: un-transform the header, use WebKit's native scroller on the header
       dropdowns, drop the panel's backdrop-filter (composited layer over the
       scroller), and cap the main menu against 100dvh minus its true offset
       with safe-area bottom padding. Handlers and menu markup untouched. */
    .topBar { transform: none !important; will-change: auto !important; }
    .topBar .dropdownMenu {
      -webkit-overflow-scrolling: auto !important;
      overscroll-behavior: contain;
      touch-action: pan-y;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .topBar > .dropdownMenu:has(.menuQuick) {
      max-height: calc(100vh - 140px) !important;
      max-height: calc(100dvh - 140px) !important;
      padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)) !important;
    }
  </style>
  <style id="sdx-signin-layout-v2">
    /* ===== SDX SIGN-IN LAYOUT v2 (2026-10-10) =====
       owner, with a photo of the live screen: "Make it better and
       also the ig in the middle bottom outside of the white shape."
       1) THE IG CHIP LEAVES THE CARD. In PR #19 the chip sat at the
          card's bottom-right corner, INSIDE the white shape. It now
          hangs centered below the card's bottom edge, on the navy
          overlay — same injected anchor, same href, icon only. The
          anchor is a child of .pinCard (position:relative), so
          top:calc(100% + 18px) puts its top edge 18px under the card
          on every variant (sign-in / register / pending), and
          left:0;right:0 with auto side margins centers it on the
          card WITHOUT a transform — the login-motion entrance
          animates .pinIg's transform (sdxPinRise, fill both), which
          would override a translateX(-50%) forever. The overlay is
          the scroll container (PR #14) and the chip is part of its
          scrollable overflow, so when a tall card fills the viewport
          (register, keyboard up) the chip scrolls into reach below
          the card and can never overlap card content — its position
          is card-relative, never viewport-relative. A deeper shadow
          plus a hairline light edge make the light disc read as a
          deliberate element on the dark background.
       2) POLISH ("make it better"). A deeper, layered card shadow so
          the white shape carries real presence on the navy; a calmer
          vertical rhythm — logo, title, subtitle and form get a
          little more air (full-height screens only, so the compact
          short-screen rhythm in App.css is untouched); the two
          footer lines sit quieter. Colors stay inside the locked

          white); PR #14's button colors (navy enabled, true-gray
          disabled) and the PR #19 centering pattern are not touched. */

  <body>
    <!-- Google Translate widget — mounted here permanently, teleported into popover via JS -->
    <div id="google_translate_element" style="position:fixed;top:-9999px;left:-9999px;"></div>
    <!-- Instant splash screen while JS loads -->
    <div id="splash">
      <div class="sp-logo" id="sp-logo-text">SDX Inspect</div>
      <div class="sp-bar"><div class="sp-fill"></div></div>
    </div>
    <script>
      // White-label splash: show the venue's own company name if we've cached it
      (function () {
        try {
          var v = new URLSearchParams(location.search).get("v") || "default";
          var vs = JSON.parse(localStorage.getItem("sdx_venue_settings_" + v) || "{}");
          if (vs.companyName) document.getElementById("sp-logo-text").textContent = vs.companyName;
          else if (v !== "default") document.getElementById("sp-logo-text").textContent = "SDX Inspect";
          if (vs.primaryColor && /^#[0-9a-fA-F]{6}$/.test(vs.primaryColor)) {
            document.getElementById("splash").style.background = "linear-gradient(135deg," + vs.primaryColor + " 0%,#16152e 100%)";
          }
        } catch (e) {}
      })();
    </script>
    <!-- Boot overlay: the splash, alive. Purely visual (aria-hidden,
         pointer-events:none); dismissal is CSS-first — see the login
         motion <style> in <head>. Mark geometry = the shipped favicon. -->
    <div id="sdx-boot" aria-hidden="true">
      <div class="boot-glow"></div>
      <div class="boot-stage">
        <svg class="boot-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" focusable="false">
          <path class="boot-sq" pathLength="100" d="M32 9h11a12 12 0 0 1 12 12v22a12 12 0 0 1-12 12H21a12 12 0 0 1-12-12V21a12 12 0 0 1 12-12h11z"/>
          <path class="boot-ck" pathLength="100" d="M20.5 32.6L28.8 41L44.2 23.7"/>
        </svg>
        <div class="boot-name">SDX Inspect</div>
        <div class="boot-tag">Kitchen Inspection &amp; Food Safety</div>
      </div>
    </div>
    <script>
      // Boot overlay dismissal watcher. The CSS timeline dismisses the
      // overlay on its own at ~1.6s even if every script fails; this
      // watcher only dismisses it EARLIER, once the app has mounted
      // (#root populated) and the draw-in has had its moment (0.7s —
      // retimed 2026-10-10, was 1.4s) — plus a hard backstop, so the
      // overlay can never outstay its welcome.
      (function () {
        var boot = document.getElementById("sdx-boot");
        if (!boot) return;
        var t0 = Date.now(), done = false;
        function hide() {
          if (done) return; done = true;
          boot.classList.add("boot-done");
          setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 700);
        }
        var iv = setInterval(function () {
          var root = document.getElementById("root");
          var mounted = root && root.childElementCount > 0;
          if ((mounted && Date.now() - t0 >= 700) || Date.now() - t0 >= 2600) { clearInterval(iv); hide(); }
        }, 120);
        setTimeout(hide, 3000);
      })();
    </script>
    <div id="root"></div>
    <!-- Capture early JS errors so the splash can display them instead of looping -->
    <script>
      window.__earlyErrors = [];
      window.addEventListener("error", function (e) {
        window.__earlyErrors.push((e.message || "Unknown error") + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__earlyErrors.push("Promise: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Splash watchdog: if React hasn't dismissed the splash in 6s, the JS
         bundle likely failed to load (stale SW cache). Clear all caches and reload. -->
    <script>
      (function () {
        var TIMEOUT = 6000;
        var t = setTimeout(function () {
          var splash = document.getElementById("splash");
          if (!splash || splash.classList.contains("hide")) return; // React mounted fine
          // Count attempts — reload once, then STOP and show the real error
          var attempts = 0;
          try { attempts = parseInt(sessionStorage.getItem("sdx_boot_attempts") || "0", 10); } catch (e) {}
          if (attempts >= 1) {
            try { sessionStorage.removeItem("sdx_boot_attempts"); } catch (e) {}
            var errs = (window.__earlyErrors || []).slice(0, 4).join("\n");
            splash.innerHTML =
              '<div style="max-width:340px;text-align:center;font-family:sans-serif;color:#fff;padding:20px">' +
              '<div style="font-size:2rem;margin-bottom:10px">⚠️</div>' +
              '<div style="font-weight:700;margin-bottom:8px">The app could not start</div>' +
              '<div style="font-size:0.72rem;color:rgba(255,255,255,.7);white-space:pre-wrap;word-break:break-word;text-align:left;background:rgba(0,0,0,.35);border-radius:8px;padding:10px;margin-bottom:12px">' +
              (errs ? errs.replace(/</g, "&lt;") : "No error captured — likely a network problem reaching the server.") +
              '</div>' +
              '<button onclick="sessionStorage.clear();location.reload()" style="background:#EE0000;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-weight:700">Try Again</button>' +
              '</div>';
            splash.style.display = "flex";
            splash.style.alignItems = "center";
            splash.style.justifyContent = "center";
            return;
          }
          try { sessionStorage.setItem("sdx_boot_attempts", String(attempts + 1)); } catch (e) {}
          // React never mounted — nuke SW caches and reload fresh (one time only)
          if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage("CLEAN_CACHE");
          }
          if ("caches" in window) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).then(function () { window.location.reload(true); });
          } else {
            window.location.reload(true);
          }
        }, TIMEOUT);
        // React dismissed splash — cancel watchdog
        var observer = new MutationObserver(function () {
          var splash = document.getElementById("splash");
          if (!splash || splash.classList.contains("hide")) {
            clearTimeout(t);
            observer.disconnect();
            try { sessionStorage.removeItem("sdx_boot_attempts"); } catch (e) {}
          }
        });
        observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });
      })();
    </script>
    <!-- SDX Instagram row — INTERIM index.html implementation (2026-10-10).
         owner asked for the IG link in the app at 07:25 ("Put the ig in
         the app so they can click it and go in"); the real patch edits
         src/App.jsx (~/workspace/sdx-ig-link/ig-link.patch) and is queued
         in the Mac landing stack. Until it lands, this script injects the
         same row — same .pinIg class, glyph, link and footer placement —
         into the badge sign-in card.
         DEDUPE GUARD: before injecting it checks for an existing .pinIg
         anywhere in the card and stands down if one is there, so the day
         the App.jsx patch ships, the app's native row is the only row
         and this script adds nothing. The MENU placement is NOT done
         here — it already lives in the menu-redesign package.
         Language: the label follows the card's own rendered language —
         "Sigue a @sdxinspection" when the card reads Spanish (visible
         text or the translate cookie), "Follow @sdxinspection" otherwise.
         Inert on every screen except the sign-in card. -->
    <script>
      (function () {
        var IG_URL = "https://www.instagram.com/sdxinspection";
        var EN = "Follow @sdxinspection", ES = "Sigue a @sdxinspection";
        var GLYPH = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.25"/><circle cx="17.35" cy="6.65" r="0.7" fill="currentColor" stroke="none"/></svg>';
        function cardIsSpanish(card) {
          try {
            if (/(?:^|;\s*)googtrans=[^;]*\/es(?:;|$)/.test(document.cookie || "")) return true;
            var t = card.textContent || "";
            return /iniciar sesi|gafete|credencial|insignia|ingresa|ingrese|solicitar acceso|n[uú]mero de/i.test(t);
          } catch (e) { return false; }
        }
        function ensure() {
          var card = document.querySelector(".pinOverlay .pinCard") || document.querySelector(".pinCard");
          if (!card) return; // not on the sign-in screen — stay inert
          var row = card.querySelector(".pinIg");
          if (row) {
            // A row already exists: if it's ours, keep its label in the
            // card's current language; if it's the app's own (the App.jsx
            // patch has landed), stand down completely — never duplicate.
            if (row.getAttribute("data-sdx-ig") === "injected") {
              var span = row.querySelector("[data-sdx-ig-label]");
              var label = cardIsSpanish(card) ? ES : EN;
              if (span && span.textContent !== label) span.textContent = label;
            }
            return;
          }
          var a = document.createElement("a");
          a.className = "pinIg";
          a.setAttribute("data-sdx-ig", "injected");
          a.href = IG_URL;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.setAttribute("aria-label", "Follow SDX Inspect on Instagram (opens Instagram)");
          a.innerHTML = GLYPH + "<span data-sdx-ig-label></span>";
          a.querySelector("[data-sdx-ig-label]").textContent = cardIsSpanish(card) ? ES : EN;
          var footer = card.querySelector(".pinFooter");
          if (footer && footer.parentNode === card) card.insertBefore(a, footer);
          else card.appendChild(a);
        }
        var queued = false;
        function schedule() {
          if (queued) return; queued = true;
          var run = function () { queued = false; try { ensure(); } catch (e) {} };
          if (window.requestAnimationFrame) requestAnimationFrame(run); else setTimeout(run, 50);
        }
        if (document.body && window.MutationObserver) {
          new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true, characterData: true });
        }
        schedule();
      })();
    </script>
